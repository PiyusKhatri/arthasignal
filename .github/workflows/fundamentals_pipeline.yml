name: Fundamentals Pipeline

on:
  schedule:
    - cron: "15 2 * * 6"
  workflow_dispatch: {}

jobs:
  run-fundamentals-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run fundamentals backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.pipeline.backfill_fundamentals

      - name: Run promoter holding backfill
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m src.pipeline.backfill_promoter_holding
