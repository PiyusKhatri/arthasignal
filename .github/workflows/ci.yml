name: CI

on:
  pull_request: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: artha
          POSTGRES_PASSWORD: artha_ci_password
          POSTGRES_DB: artha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artha -d artha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://artha:artha_ci_password@127.0.0.1:5432/artha
      DATABASE_URL_READONLY: postgresql+psycopg2://artha:artha_ci_password@127.0.0.1:5432/artha
      JWT_SECRET_KEY: ci-only-not-for-production-arthasignal-secret
      FRONTEND_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Compile backend
        run: python -m compileall -q src tests

      - name: Initialize database schema
        run: python -m src.database.init_db

      - name: Verify API imports
        run: python -c "from src.api.main import app; assert app.title == 'ArthaSignal API'"

      - name: Run Python tests
        run: pytest -q

  frontend:
    name: Frontend lint, types, build, smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    env:
      API_BASE_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production frontend
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/arthasignal-next.log 2>&1 &
          echo $! > /tmp/arthasignal-next.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/arthasignal-next.log
          exit 1

      - name: Run frontend smoke test
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000
        run: npm run test:smoke

      - name: Print frontend log on failure
        if: failure()
        run: cat /tmp/arthasignal-next.log || true
