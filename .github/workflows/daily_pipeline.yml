name: Daily Pipeline

on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch: {}

jobs:
  run-daily-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_READONLY: ${{ secrets.DATABASE_URL_READONLY || secrets.DATABASE_URL }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Verify pg_dump 17 is installed
        run: |
          /usr/lib/postgresql/17/bin/pg_dump --version
          /usr/lib/postgresql/17/bin/pg_dump --version | grep -q "17\." || (echo "postgresql-client-17 install verification failed" && exit 1)

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Verify scheduled database is reachable
        run: |
          python - <<'PY'
          import os
          from urllib.parse import urlparse
          from sqlalchemy import text
          from src.database.connection import engine

          url = os.environ.get("DATABASE_URL", "")
          host = urlparse(url).hostname
          if not url:
              raise SystemExit("DATABASE_URL secret is not configured")
          if host in {"localhost", "127.0.0.1", "db"}:
              raise SystemExit(
                  "Scheduled GitHub-hosted jobs cannot use the local Docker database. "
                  "Point DATABASE_URL at a network-reachable production Postgres instance "
                  "or move this workflow to a self-hosted runner beside the database."
              )
          with engine.connect() as connection:
              connection.execute(text("SELECT 1"))
          print("Database connectivity check passed")
          PY

      - name: Run daily pipeline
        run: python -m src.pipeline.run_all_daily
